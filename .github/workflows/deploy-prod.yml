name: Deploy → Prod

# ============================================================
# TEMPORARY CONFIGURATION — DEPLOY-PROD ROUTES TO DEV PROJECT
# ============================================================
# Both deploy-dev.yml (dev branch) and this file (main branch)
# currently deploy to the nats-rack dev Firebase project.
#
# To switch this workflow to the production project when ready:
#
#   STEP 1 — Update the Build env block (below) to use PROD secrets:
#     VITE_FIREBASE_API_KEY             → ${{ secrets.PROD_FIREBASE_API_KEY }}
#     VITE_FIREBASE_AUTH_DOMAIN         → ${{ secrets.PROD_FIREBASE_AUTH_DOMAIN }}
#     VITE_FIREBASE_PROJECT_ID          → ${{ secrets.PROD_FIREBASE_PROJECT_ID }}
#     VITE_FIREBASE_STORAGE_BUCKET      → ${{ secrets.PROD_FIREBASE_STORAGE_BUCKET }}
#     VITE_FIREBASE_MESSAGING_SENDER_ID → ${{ secrets.PROD_FIREBASE_MESSAGING_SENDER_ID }}
#     VITE_FIREBASE_APP_ID              → ${{ secrets.PROD_FIREBASE_APP_ID }}
#
#   STEP 2 — Update the Deploy step:
#     firebaseServiceAccount → ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
#     projectId              → the-addicts-agenda
#
#   STEP 3 — Remove this comment block.
#
#   STEP 4 — Log the switchover in docs/DECISIONS.md.
#
# Prerequisites before switchover:
#   - the-addicts-agenda Firebase Hosting configured and tested
#   - All 14 GitHub Actions secrets verified in repo Settings
#   - Custom domain DNS pointing to the-addicts-agenda (if applicable)
#   - Identity Platform upgrade complete (E03 MFA compliance gate)
#   - Legal sign-off on cannabis/fireworks regulatory compliance
# ============================================================

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'functions/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'index.html'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm production deployment'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.confirm == 'DEPLOY'
    steps:
      - uses: actions/checkout@v4

      - name: Check package.json exists
        id: check
        run: |
          if [ ! -f package.json ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No package.json yet — skipping. Scaffold the Vite app first."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node 20
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: npm ci

      - name: Lint Code
        if: steps.check.outputs.skip != 'true'
        run: npm run lint

      - name: Unit Tests
        if: steps.check.outputs.skip != 'true'
        run: npm run test

      - name: Generate version
        if: steps.check.outputs.skip != 'true'
        run: echo "VITE_APP_VERSION=v$(date +'%y.%m.%d')-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY:            ${{ secrets.DEV_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.DEV_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.DEV_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.DEV_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.DEV_FIREBASE_APP_ID }}
          VITE_APP_VERSION:                 ${{ env.VITE_APP_VERSION }}

      # A11y, E2E, and LHCI gates run separately — see .github/workflows/e2e.yml
      # Trigger on demand from GitHub Actions UI, or runs automatically every Sunday 03:00 UTC.
      # Local: npm run test:e2e | npm run test:a11y | npm run test:lhci (see docs/TESTING.md)

      - name: Deploy to Firebase Dev
        if: steps.check.outputs.skip != 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          projectId: nats-rack
          channelId: live
        env:
          VITE_FIREBASE_API_KEY:            ${{ secrets.DEV_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.DEV_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.DEV_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.DEV_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.DEV_FIREBASE_APP_ID }}
          VITE_APP_VERSION:                 ${{ env.VITE_APP_VERSION }}
